<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · AlphaAnalytics Delegation</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">

  <nav class="sidebar">
    <div class="brand">AlphaAnalytics Solutions</div>
    <div class="brand-sub">Delegation Command Center</div>
    <a class="nav-link active" href="index.html">Dashboard</a>
    <a class="nav-link" href="assign-task.html">Assign a Task</a>
    <a class="nav-link" href="my-tasks.html">My Tasks</a>
    <div class="sidebar-footer">As of <span id="todayLabel"></span></div>
  </nav>

  <div class="main">
    <div class="topbar">
      <h1>Dashboard</h1>
      <div class="who">
        Viewing as
        <select id="personSelect"></select>
      </div>
    </div>

    <div class="content">
      <div class="stat-grid" id="statGrid"></div>

      <div class="card">
        <h2>Most overdue open tasks</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Task ID</th><th>Task</th><th>Assigned to</th><th>Days overdue</th><th>Priority</th></tr>
            </thead>
            <tbody id="overdueBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script>
  document.getElementById("todayLabel").textContent =
    new Date().toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });

  Api.getPeople().then(people => {
    const select = document.getElementById("personSelect");
    select.innerHTML = people.map(p => `<option value="${p.name}">${p.name} — ${p.department}</option>`).join("");
    select.addEventListener("change", () => localStorage.setItem("currentUser", select.value));
    const saved = localStorage.getItem("currentUser");
    if (saved && people.some(p => p.name === saved)) select.value = saved;
    else localStorage.setItem("currentUser", select.value);
  });

  Api.getAllTasks().then(tasks => {
    const total = tasks.length;
    const completed = tasks.filter(t => t.status === "Completed").length;
    const overdue = tasks.filter(t => t.daysOverdue > 0 && t.status !== "Completed").length;
    const open = tasks.filter(t => t.status !== "Completed").length;
    const rate = total ? Math.round((completed / total) * 100) : 0;

    const stats = [
      { label: "Total tasks", num: total },
      { label: "Open", num: open },
      { label: "Overdue", num: overdue },
      { label: "Completed", num: completed },
      { label: "Completion rate", num: rate + "%" }
    ];

    document.getElementById("statGrid").innerHTML = stats
      .map(s => `<div class="stat"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`)
      .join("");

    const overdueRows = tasks
      .filter(t => t.daysOverdue > 0 && t.status !== "Completed")
      .sort((a, b) => b.daysOverdue - a.daysOverdue)
      .slice(0, 10);

    const body = document.getElementById("overdueBody");

    if (!overdueRows.length) {
      body.innerHTML = `<tr><td colspan="5" class="empty-state">No overdue tasks right now.</td></tr>`;
      return;
    }

    body.innerHTML = overdueRows.map(t => `
      <tr>
        <td>${t.taskId}</td>
        <td>${t.task}</td>
        <td>${t.delegatedTo}</td>
        <td>${t.daysOverdue}</td>
        <td><span class="badge ${priorityBadgeClass(t.priority)}">${t.priority}</span></td>
      </tr>`).join("");
  });
</script>
</body>
</html>
